<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Proyecto Hola Mundo moderno creado con la integración de Antigravity, GitHub Pages y Vibe Coding.">
  <title>Hola Mundo | Modern Web Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover-border: rgba(139, 92, 246, 0.4);
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --accent: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo dinámico con gradientes radiales */
    .background-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      animation: floatAnimation 12s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      top: -10%;
      left: 15%;
    }

    .blob-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #0284c7 0%, transparent 70%);
      bottom: -15%;
      right: 15%;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #db2777 0%, transparent 70%);
      top: 40%;
      left: 60%;
      animation-delay: -3s;
    }

    @keyframes floatAnimation {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(30px, 40px) scale(1.08);
      }
    }

    /* Contenedor Principal */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      padding: 1.5rem;
    }

    /* Tarjeta con Glassmorphism */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-4px);
      box-shadow: 0 30px 70px -15px rgba(124, 58, 237, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* Badge superior */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #c4b5fd;
      margin-bottom: 1.75rem;
      letter-spacing: 0.03em;
    }

    .badge-indicator {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulseIndicator 2s infinite;
    }

    @keyframes pulseIndicator {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Título con gradiente */
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 15%, #c084fc 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
      transition: transform 0.3s ease;
    }

    /* Descripción */
    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-weight: 300;
    }


    /* Acciones */
    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #ffffff;
      padding: 0.85rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px -4px rgba(124, 58, 237, 0.55);
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Stack Showcase */
    .stack-showcase {
      margin: 1.5rem 0 2rem;
      padding: 1.1rem 1.25rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      backdrop-filter: blur(10px);
    }

    .stack-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .tech-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .tech-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      transition: all 0.25s ease;
    }

    .tech-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .glow-purple {
      background-color: #a855f7;
      box-shadow: 0 0 8px #a855f7;
    }

    .glow-cyan {
      background-color: #06b6d4;
      box-shadow: 0 0 8px #06b6d4;
    }

    .glow-pink {
      background-color: #ec4899;
      box-shadow: 0 0 8px #ec4899;
    }

    /* Pie de página */
    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">
    <div class="card">
      <div class="badge">
        <span class="badge-indicator"></span>
        <span>HTML5 & CSS Moderno</span>
      </div>

      <h1 id="greeting-title">¡Hola, Mundo!</h1>

      <p class="subtitle" id="greeting-desc">
        Tu primer proyecto web con estilo moderno, glassmorphism y diseño responsivo.
      </p>

      <div class="stack-showcase">
        <p class="stack-label">Hecho con la integración de</p>
        <div class="tech-pills">
          <span class="tech-pill"><span class="pill-dot glow-purple"></span> Antigravity</span>
          <span class="tech-pill"><span class="pill-dot glow-cyan"></span> GitHub Pages</span>
          <span class="tech-pill"><span class="pill-dot glow-pink"></span> Vibe Coding</span>
        </div>
      </div>

      <div class="actions">
        <button id="change-btn" class="btn" type="button">
          <span>Cambiar idioma</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 8 6 6"/>
            <path d="m4 14 6-6 2-3"/>
            <path d="M2 5h12"/>
            <path d="M7 2h1"/>
            <path d="m22 22-5-10-5 10"/>
            <path d="M14 18h6"/>
          </svg>
        </button>
      </div>

      <p class="footer">index.html • Listo para visualizar en cualquier navegador</p>
    </div>
  </main>

  <script>
    const greetings = [
      { text: "¡Hola, Mundo!", desc: "Tu primer proyecto web con estilo moderno, glassmorphism y diseño responsivo." },
      { text: "Hello, World!", desc: "Your first web project with a modern touch and fluid animations." },
      { text: "Bonjour, le Monde!", desc: "Votre premier projet web au design soigné et contemporain." },
      { text: "Ciao, Mondo!", desc: "Il tuo primo progetto web moderno ed elegante." },
      { text: "Olá, Mundo!", desc: "Seu primeiro projeto web moderno com estilo e interatividade." }
    ];

    let currentIndex = 0;
    const greetingTitle = document.getElementById("greeting-title");
    const greetingDesc = document.getElementById("greeting-desc");
    const changeBtn = document.getElementById("change-btn");

    changeBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % greetings.length;
      const current = greetings[currentIndex];

      greetingTitle.style.transform = "scale(0.95)";
      greetingTitle.style.opacity = "0.4";

      setTimeout(() => {
        greetingTitle.textContent = current.text;
        greetingDesc.textContent = current.desc;
        greetingTitle.style.transform = "scale(1)";
        greetingTitle.style.opacity = "1";
      }, 150);
    });
  </script>
</body>
</html>
